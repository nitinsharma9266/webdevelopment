<!DOCTYPE html>
<html>
<body>
    <h2>Number Operations</h2>

    <script>
        let a = Number(prompt("Enter first number:"));
        let b = Number(prompt("Enter second number:"));
        let c = Number(prompt("Enter third number:"));

        let sum = a + b + c;
        let average = sum / 3;
        let product = a * b * c;
        let smallest = Math.min(a, b, c);
        let largest = Math.max(a, b, c);

        alert(
            "Sum = " + sum +
            "\nAverage = " + average +
            "\nProduct = " + product +
            "\nSmallest = " + smallest +
            "\nLargest = " + largest
        );
    </script>
</body>
</html>
