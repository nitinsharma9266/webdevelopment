<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            
            background-color:rgb(70, 203, 108);
            position: relative;
            
            text-align: center;
            color: rgb(36, 15, 230);
           
            height: 100px;
            width: 100px;
            border: 1px solid;
            text-shadow: 2px 2px 10px red;
            font-weight:bold;
            font-style: italic;
            text-decoration: underline;
            
            transition-property: height, width;
            transition-duration: 1s,500ms;
            transition-timing-function: linear;
            transition-delay: 0s,1s;
        }
        
        div:hover{
            height: 200px;
            width: 200px;
        }
    </style>
</head>
<body>
    <div>HELLO WORLD</div>
</body>
</html>
