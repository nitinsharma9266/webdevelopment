<!--types of list 
1.ordered list and unordered list-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list</title>
</head>
<body>
    <h2>Ordered list</h2>
    <ol type="i">
        <li>HTML</li>
        <li>CSS</li>
        <li>JAVA script</li>
    </ol>
    <h2>unordered list--</h2>
    <ul type="circle">
        <li>HTML</li>
        <li>CSS</li>
        <li>JAVA script</li>
    </ul>
</body>
</html>
