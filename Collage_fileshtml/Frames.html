<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Vertical Columns</title>
    <style>
        .container{
            display: flex;
            height: 300px;

        }
        .column{
            flex: 1;
            padding: 20px;
        }
        .red{
            background-color: red;
        }
        .blue{
            background-color: blue;
            color: white;
        }
        .green{
            background-color: green;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="column red">Red column</div>
        <div class="column blue">Blue Column</div>
        <div class="column green">Green Column</div>
    </div>
</body>
</html>
