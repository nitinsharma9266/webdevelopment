<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Table</title>

    <style>
        table{
            border-collapse: collapse;
            width: 100%;
            text-align: center;
        }
        th,td{
            border: 1px solid black;
            padding: 10px;
        }
        .lab{
            background-color: lightblue;
        }
        .elective{
            background-color: lightyellow;
        }
        .break{
            background-color: lightgray;
        }
        
    </style>
</head>
<body>
    <h2 align="center">Class Time Table<h2>

    <table>
        <tr>
            <th>Day</th>
            <th>9-10 AM</th>
            <th>10-11 AM</th>
            <th>11-12 PM</th>
            <th>12-1 PM</th>
            <th>1-2 PM</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>DBMS</td>
            <td>DAA</td>
            <td>Math</td>
            <td rowspan="5" class="break">Lunch Break</td>
            <td class="elective">Elective</td>
        </tr>
        <tr>
            <td>Tuesday</td>
            <td>OS</td>
            <td>DBMS</td>
            <td>DAA</td>
            <td>Math</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td colspan="2" class="lab">Computer Lab</td>
            <td>OS</td>
            <td>DBMS</td>
        </tr>
        <tr>
            <td>Thursday</td>
            <td>Maths</td>
            <td>OS</td>
            <td>DAA</td>
            <td class="elective">Elective</td>
        </tr>
        <tr>
            <td>Friday</td>
            <td>DBMS</td>
            <td>Maths</td>
            <td>OS</td>
            <td>DAA</td>
        </tr>

    </table>
    
</body>
</html>
